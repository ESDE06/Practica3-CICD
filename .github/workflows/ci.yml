name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Validación, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install
      - name: Revisar sintaxis
        run: npm run lint
      - name: Ejecutar pruebas y cobertura
        run: npm test
      - name: Construir imagen Docker
        run: docker build -t tareas-devops-itla:${{ github.sha }} .
      - name: Verificar archivos del sitio
        run: test -s public/index.html

  deploy-pages:
    name: Publicar en GitHub Pages
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefacto del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Desplegar sitio
        id: deployment
        uses: actions/deploy-pages@v4
